<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E.I.G 予約状況</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --line:#e4e7ec; --text:#2a3342; --sub:#8a94a6;
  --free:#7cb98d; --free-bg:#eef6f0; --busy:#d5dae2; --accent:#5b8def;
  --sat:#6b9bd8; --sun:#d98a8a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;padding-bottom:2.5rem}
main{max-width:560px;margin:0 auto}
header{padding:1.15rem 1rem .5rem}
h1{font-size:1.15rem;font-weight:800;letter-spacing:.01em}
h1 .mark{margin-right:.35rem}
#updated{font-size:.72rem;color:var(--sub);margin-top:.25rem}
#refresh{background:var(--card);border:1px solid var(--line);color:var(--accent);font-size:.8rem;font-weight:700;border-radius:999px;padding:.38rem .85rem;cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:0 1px 2px rgba(30,41,59,.06)}
#refresh:active{filter:brightness(.95)}
#refresh:disabled{color:var(--sub);cursor:default}
#clearsel{background:var(--accent);border:none;color:#fff;font-size:.72rem;font-weight:600;border-radius:999px;padding:.25rem .7rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#clearsel:active{filter:brightness(.9)}
section{padding:0 .6rem}
h2{font-size:.85rem;color:var(--sub);margin:.9rem 0 .4rem;padding:0 .4rem}
#next{background:var(--card);border:1px solid var(--line);border-radius:.9rem;padding:.4rem .9rem;font-size:.9rem;margin:0 .4rem;box-shadow:0 1px 3px rgba(30,41,59,.06)}
#next>div{display:flex;align-items:center;gap:.5rem;padding:.5rem 0}
#next>div+div{border-top:1px solid var(--line)}
#next .t{color:var(--accent);font-variant-numeric:tabular-nums;font-weight:700;min-width:7.2em}
#next .chip{display:inline-block;background:var(--free-bg);color:#4d8a60;border:1px solid #d8e8dc;border-radius:.45rem;font-size:.78rem;font-weight:600;padding:.1rem .45rem;margin-right:.25rem}
#next .empty{color:var(--sub);padding:.6rem 0}

#weekwrap{background:var(--card);border:1px solid var(--line);border-radius:.9rem;padding:.45rem .35rem .55rem;margin:0 .4rem;box-shadow:0 1px 3px rgba(30,41,59,.06)}
#week{width:100%;border-collapse:separate;border-spacing:2px;font-variant-numeric:tabular-nums;table-layout:fixed}
#week th{font-size:.68rem;color:var(--sub);font-weight:600;padding:.3rem 0 .35rem;position:sticky;top:0;background:var(--card);z-index:2}
#week th.today{color:var(--accent)}
#week th.sat{color:var(--sat)}
#week th.sun{color:var(--sun)}
#week th .dow{display:block;font-size:.62rem}
#week td{padding:1px;text-align:center;border-radius:.35rem}
#week td.sat{background:rgba(107,155,216,.08)}
#week td.sun{background:rgba(217,138,138,.08)}
#week td.todaycol{background:rgba(91,141,239,.10)}
#week td.time{color:var(--sub);font-size:.68rem;text-align:right;padding-right:.25rem;width:2.6em;background:transparent}
tr.band td{padding-top:7px}
tr.band td.time{padding-top:6px;color:var(--text);font-weight:700}
tr.nowrow td.time{color:var(--accent);font-weight:700}
tr.nowrow td:not(.time){outline:1px solid rgba(91,141,239,.6);outline-offset:-1px}
tr.odd .cell{background:#fafbfc}
tr.odd a.cell{background:var(--free-bg)}
td,.cell{transition:opacity .15s}
#week th:not(:first-child),#week td.time{cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
#week th.sel,#week td.time.sel{color:#fff!important;background:var(--accent);border-radius:.4rem}
#week th.sel .dow{color:#fff}
#week.hasSel td:not(.time){opacity:.3}
#week.hasSel td.hl{opacity:1}
#week td.cross{outline:2px solid var(--accent);outline-offset:-1px}
#week.hasSel tr.nowrow td:not(.time){outline:none}
#week.hasSel tr.nowrow td.cross{outline:2px solid var(--accent)}
.cell{display:flex;gap:2px;align-items:stretch;justify-content:center;border-radius:.4rem;padding:3px;background:#fdfdfe;border:1px solid var(--line);text-decoration:none;height:23px}
a.cell{border-color:#d3e5d8}
a.cell:active{filter:brightness(.93)}
.cell.closed{background:transparent;border:1px dashed var(--line)}
.cell.past{opacity:.35}
.seg{flex:1 1 0;border-radius:2.5px;background:var(--busy)}
.seg.free{background:var(--free)}
.cell.closed .seg{background:#edf0f4}

#myres{margin:0 .4rem;background:var(--card);border:1px solid var(--line);border-radius:.9rem;box-shadow:0 1px 3px rgba(30,41,59,.06);overflow:hidden}
#myres summary{list-style:none;cursor:pointer;padding:.7rem .9rem;font-size:.9rem;font-weight:700;display:flex;align-items:center;justify-content:space-between}
#myres summary::-webkit-details-marker{display:none}
#myres summary .chev{color:var(--sub);font-weight:400;transition:transform .2s}
#myres[open] summary .chev{transform:rotate(180deg)}
#myres .inner{padding:0 .9rem .9rem}
#myres .warn{font-size:.7rem;color:var(--sub);line-height:1.7;background:#fbf7ee;border:1px solid #f0e6d0;border-radius:.5rem;padding:.5rem .6rem;margin-bottom:.6rem}
#myres input{width:100%;font-size:.82rem;padding:.5rem .6rem;border:1px solid var(--line);border-radius:.5rem;font-family:inherit;margin-bottom:.5rem}
#myres .row{display:flex;gap:.5rem}
#myres [hidden]{display:none!important}
#myres button{flex:1;font-size:.82rem;font-weight:700;border-radius:.5rem;padding:.5rem;cursor:pointer;-webkit-tap-highlight-color:transparent;border:1px solid var(--line)}
#myres .save{background:var(--accent);color:#fff;border-color:var(--accent)}
#myres .clear{background:var(--card);color:var(--sub)}
#myres .result{margin-top:.7rem;font-size:.85rem}
#myres .result .item{display:flex;align-items:center;gap:.5rem;padding:.45rem 0;border-top:1px solid var(--line)}
#myres .result .item .t{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text)}
#myres .result .item .seatno{background:var(--free-bg);color:#4d8a60;border:1px solid #d8e8dc;border-radius:.4rem;font-size:.75rem;font-weight:600;padding:.05rem .4rem}
#myres .qrbox{text-align:center;margin-top:.7rem}
#myres .qrbox img{width:220px;height:220px;image-rendering:pixelated;border:1px solid var(--line);border-radius:.5rem;padding:.4rem;background:#fff}
#myres .qrbox .exp{font-size:.72rem;color:var(--sub);margin-top:.4rem}
#myres .qrbtn{background:var(--card);color:var(--accent);border:1px solid var(--line);margin-top:.6rem}
#myres .msg{font-size:.78rem;color:var(--sub);padding:.3rem 0}
#myres .msg.err{color:#c0693f}
#official{text-align:center;padding:1.1rem 1rem .2rem;max-width:560px;margin:0 auto}
#official a{display:inline-flex;align-items:center;gap:.4rem;color:var(--accent);font-size:.82rem;font-weight:600;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.45rem 1rem;box-shadow:0 1px 2px rgba(30,41,59,.06)}
#official a:active{filter:brightness(.95)}
#legend{font-size:.72rem;color:var(--sub);padding:.7rem 1.1rem 0;line-height:1.9;display:flex;flex-wrap:wrap;gap:.2rem 1.1rem;max-width:560px;margin:0 auto}
#legend .seg{display:inline-block;width:.65rem;height:.65rem;border-radius:2px;vertical-align:-1px;margin-right:.2rem;background:var(--busy)}
#legend .seg.free{background:var(--free)}
.err{color:#d64545;padding:1rem}
</style>
<script src="qrcode.js"></script>
</head>
<body>
<main>
<header>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:.6rem">
    <h1><span class="mark">⛳</span>E.I.G 予約状況</h1>
    <button id="refresh" title="最新の状況を取り直す">↻ 更新</button>
  </div>
  <div id="updated">読み込み中…</div>
</header>
<section>
  <h2>次の空き</h2>
  <div id="next">—</div>
  <h2 style="display:flex;align-items:center;justify-content:space-between">週間タイムテーブル（左から 打席1・2・3）
    <button id="clearsel" hidden>選択解除 ×</button></h2>
  <div id="weekwrap">
  <table id="week">
    <thead><tr id="whead"><th></th></tr></thead>
    <tbody id="wbody"></tbody>
  </table>
  </div>
</section>
<div id="legend">
  <span><span class="seg free"></span>空き</span>
  <span><span class="seg"></span>予約済</span>
  <span>枠線のみ: 受付時間外</span>
  <span>各マスは左から打席1・2・3</span>
  <span>空きマスのタップで予約画面へ</span>
</div>
<details id="myres">
  <summary>マイ予約（自分の予約を見る）<span class="chev">▾</span></summary>
  <div class="inner">
    <div class="warn">
      ⚠ hacomono のログインID（メール/電話番号）とパスワードで直接ログインできます。
      パスワードは<b>ログイン時に1回だけ</b>中継され、保存されません。発行されたセッションのみ<b>このブラウザ内</b>に保持します。
      共有端末では使わないでください。
    </div>
    <div id="loginform">
      <input id="loginid" type="text" placeholder="メールアドレス または 電話番号" autocomplete="off">
      <input id="loginpw" type="password" placeholder="パスワード" autocomplete="off">
      <div class="row">
        <button class="save" id="loginbtn">ログインして取得</button>
      </div>
    </div>
    <div class="row" id="logoutrow" hidden>
      <button class="clear" id="logoutbtn">ログアウト（セッション消去）</button>
    </div>
    <div class="result" id="authresult"></div>
    <div id="qrarea" hidden>
      <div class="row"><button class="qrbtn" id="qrbtn">入場QRを表示</button></div>
      <div class="qrbox" id="qrbox" hidden><img id="qrimg" alt="入場QR"><div class="exp" id="qrexp"></div></div>
    </div>
  </div>
</details>
<div id="official">
  <a href="https://enjoyindoorgolf.hacomono.jp/reserve/schedule/1/1/" target="_blank" rel="noopener">hacomono 公式予約サイトを開く ↗</a>
</div>
</main>
<script>
(function(){
  // Cloudflare Worker のURL
  const WORKER_URL = new URLSearchParams(location.search).get("worker")
    || "https://eig-schedule.takanari-shimbo.workers.dev/schedule";

  const todayStr=new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Tokyo"});
  const nowHour=Number(new Date().toLocaleString("en-US",{timeZone:"Asia/Tokyo",hour:"2-digit",hour12:false}))%24;
  const fmt=d=>{const[,m,dd]=d.split("-");return `${+m}/${+dd}`};
  const dow=d=>"日月火水木金土"[new Date(d+"T00:00:00+09:00").getDay()];
  const freeSeats=s=>[1,2,3].filter(no=>!s.booked.includes(no));

  const week=document.getElementById("week");
  let selCol=null, selRow=null;

  async function load(force){
    const sep=WORKER_URL.includes("?")?"&":"?";
    let data, live=false;
    try{
      data = await fetch(WORKER_URL+(force?sep+"refresh=1":"")).then(r=>{if(!r.ok)throw 0;return r.json()});
      if(data.error) throw 0;
      live = true;
    }catch(e){
      try{
        data = await fetch("schedule.json?t="+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()});
      }catch(e2){
        document.getElementById("updated").textContent="予約状況を読み込めませんでした。";
        return null;
      }
    }
    document.getElementById("updated").textContent =
      "更新: "+data.generated_at.replace("T"," ").slice(0,16)+(live?"（リアルタイム）":"（キャッシュ表示）");
    return data;
  }

  function render(data){
    const base=data.reserve_url_base, days=data.days;

    // ヘッダ (7日分)
    const whead=document.getElementById("whead");
    whead.innerHTML="<th></th>";
    for(const d of days){
      const th=document.createElement("th");
      const w=dow(d.date);
      th.className=(d.date===todayStr?"today ":"")+(w==="土"?"sat":w==="日"?"sun":"");
      th.innerHTML=d.date===todayStr?`今日<span class="dow">${fmt(d.date)}</span>`:`${fmt(d.date)}<span class="dow">${w}</span>`;
      th.dataset.col=days.indexOf(d);
      whead.appendChild(th);
    }

    // 本体 (24時間 × 7日)
    const slotAt={};
    for(const d of days) for(const s of d.slots) slotAt[d.date+"_"+s.hour]=s;

    const wbody=document.getElementById("wbody");
    wbody.innerHTML="";
    const colCls=days.map(d=>{
      const w=dow(d.date);
      return (d.date===todayStr?"todaycol ":"")+(w==="土"?"sat":w==="日"?"sun":"");
    });
    for(let h=0;h<24;h++){
      const tr=document.createElement("tr");
      tr.className=(h%6===0&&h>0?"band ":"")+(h%2?"odd ":"")+(h===nowHour?"nowrow":"");
      let row=`<td class="time" data-hour="${h}">${h}時</td>`;
      for(let di=0;di<days.length;di++){
        const d=days[di];
        const s=slotAt[d.date+"_"+h];
        if(!s){row+=`<td class="${colCls[di]}" data-col="${di}"></td>`;continue;}
        const past=d.date<todayStr||(d.date===todayStr&&h<nowHour);
        const dots=[1,2,3].map(no=>`<span class="seg ${s.booked.includes(no)?"":"free"}"></span>`).join("");
        const open=s.reservable&&freeSeats(s).length>0;
        const cls=`cell ${!s.reservable?"closed":""} ${past?"past":""}`;
        row+= open
          ? `<td class="${colCls[di]}" data-col="${di}"><a class="${cls}" href="${base}${s.legacy_hash}" target="_blank" rel="noopener">${dots}</a></td>`
          : `<td class="${colCls[di]}" data-col="${di}"><span class="${cls}">${dots}</span></td>`;
      }
      tr.innerHTML=row;
      wbody.appendChild(tr);
    }
    applySel();

    // 次の空き
    const out=[];
    for(const day of days){
      if(day.date<todayStr) continue;
      for(const s of day.slots){
        if(day.date===todayStr && s.hour<nowHour) continue;
        const f=freeSeats(s);
        if(s.reservable && f.length){
          out.push(`<div><span class="t">${day.date===todayStr?"今日":fmt(day.date)+"("+dow(day.date)+")"} ${String(s.hour).padStart(2,"0")}:00</span><span>${f.map(n=>`<span class="chip">打席${n}</span>`).join("")}</span></div>`);
          if(out.length>=3) break;
        }
      }
      if(out.length>=3) break;
    }
    document.getElementById("next").innerHTML=out.length?out.join(""):'<div class="empty">直近の空きはありません</div>';
  }

  // 行・列の選択ハイライト (曜日ヘッダ / 時刻ラベルのタップで切替)
  function applySel(){
    week.classList.toggle("hasSel", selCol!==null||selRow!==null);
    document.getElementById("clearsel").hidden = selCol===null&&selRow===null;
    week.querySelectorAll("th[data-col]").forEach(th=>
      th.classList.toggle("sel", Number(th.dataset.col)===selCol));
    week.querySelectorAll("td.time").forEach(td=>
      td.classList.toggle("sel", Number(td.dataset.hour)===selRow));
    const both = selCol!==null && selRow!==null;
    week.querySelectorAll("td[data-col]").forEach(td=>{
      const c=Number(td.dataset.col)===selCol;
      const r=Number(td.parentElement.firstElementChild.dataset.hour)===selRow;
      // 両方選択時は交点だけを強調、片方だけなら行/列全体を強調
      td.classList.toggle("hl", both ? (c&&r) : (c||r));
      td.classList.toggle("cross", c&&r);
    });
  }
  week.addEventListener("click",e=>{
    const th=e.target.closest("th[data-col]");
    if(th){selCol = selCol===Number(th.dataset.col)?null:Number(th.dataset.col); applySel(); return;}
    const tt=e.target.closest("td.time");
    if(tt){selRow = selRow===Number(tt.dataset.hour)?null:Number(tt.dataset.hour); applySel();}
  });

  document.getElementById("clearsel").addEventListener("click",()=>{
    selCol=null; selRow=null; applySel();
  });

  // 強制更新ボタン
  const btn=document.getElementById("refresh");
  btn.addEventListener("click",async()=>{
    btn.disabled=true; btn.textContent="↻ 取得中…";
    const data=await load(true);
    if(data) render(data);
    btn.disabled=false; btn.textContent="↻ 更新";
  });

  // --- マイ予約 ---
  const AUTH_KEY="eig_auth";
  const myres=document.getElementById("myres");
  const authResult=document.getElementById("authresult");
  async function loadMy(){
    const tok=localStorage.getItem(AUTH_KEY);
    if(!tok){authResult.innerHTML="";return;}
    authResult.innerHTML='<div class="msg">取得中…</div>';
    try{
      const sep=WORKER_URL.includes("?")?"&":"?";
      const base=WORKER_URL.replace(/\/schedule.*$/,"/my");
      const r=await fetch(base,{headers:{"X-Eig-Auth":tok}});
      const d=await r.json();
      if(!r.ok||d.error){
        authResult.innerHTML='<div class="msg err">取得できませんでした（'+(d.error==="auth-invalid"?"Cookie/トークンが無効か期限切れです":d.error||r.status)+'）</div>';
        return;
      }
      const list=d.reservations||[];
      if(!list.length){authResult.innerHTML='<div class="msg">予約はありません</div>';return;}
      authResult.innerHTML=list.map(x=>{
        const dt=String(x.start_at).slice(0,16).replace("T"," ");
        const seat=x.no?`<span class="seatno">打席${x.no}</span>`:"";
        const link=x.id_hash?`<a href="${data0.reserve_url_base}${x.id_hash}" target="_blank" rel="noopener" style="margin-left:auto;color:var(--accent);font-size:.78rem">詳細↗</a>`:"";
        return `<div class="item"><span class="t">${dt}</span>${seat}${link}</div>`;
      }).join("");
    }catch(e){
      authResult.innerHTML='<div class="msg err">通信エラー</div>';
    }
  }
  const loginForm=document.getElementById("loginform");
  const logoutRow=document.getElementById("logoutrow");
  function syncAuthUI(){
    const has=!!localStorage.getItem(AUTH_KEY);
    loginForm.hidden=has; logoutRow.hidden=!has;
    document.getElementById("qrarea").hidden=!has;
    if(!has){ document.getElementById("qrbox").hidden=true; stopQrTimer(); }
  }
  // --- 入場QR ---
  let qrTimer=null, qrCountdown=null;
  function stopQrTimer(){ clearInterval(qrTimer); clearInterval(qrCountdown); qrTimer=qrCountdown=null; }
  async function showQr(){
    const tok=localStorage.getItem(AUTH_KEY);
    if(!tok) return;
    const box=document.getElementById("qrbox");
    const exp=document.getElementById("qrexp");
    exp.textContent="取得中…"; box.hidden=false;
    try{
      const qrUrl=WORKER_URL.replace(/\/schedule.*$/,"/qr");
      const r=await fetch(qrUrl,{headers:{"X-Eig-Auth":tok}});
      const d=await r.json();
      if(!r.ok||d.error||!d.token){
        exp.textContent = d.error==="auth-invalid" ? "セッション切れ。再ログインしてください" : "QRを取得できませんでした";
        document.getElementById("qrimg").removeAttribute("src");
        return;
      }
      const qr=qrcode(0,"M"); qr.addData(d.token); qr.make();
      document.getElementById("qrimg").src=qr.createDataURL(6,8);
      // 一定時間で自動更新 (短命トークン対策)
      let left=60;
      exp.textContent=`このQRをかざしてください（${left}秒で自動更新）`;
      clearInterval(qrCountdown);
      qrCountdown=setInterval(()=>{
        left--; if(left<=0){exp.textContent="更新中…";} else exp.textContent=`このQRをかざしてください（${left}秒で自動更新）`;
      },1000);
      clearInterval(qrTimer);
      qrTimer=setInterval(showQr,60000);
    }catch(e){ exp.textContent="通信エラー"; }
  }
  document.getElementById("qrbtn").addEventListener("click",showQr);
  document.getElementById("loginbtn").addEventListener("click",async()=>{
    const id=document.getElementById("loginid").value.trim();
    const pw=document.getElementById("loginpw").value;
    if(!id||!pw){authResult.innerHTML='<div class="msg err">IDとパスワードを入力してください</div>';return;}
    authResult.innerHTML='<div class="msg">ログイン中…</div>';
    try{
      const loginUrl=WORKER_URL.replace(/\/schedule.*$/,"/login");
      const r=await fetch(loginUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,password:pw})});
      const d=await r.json();
      document.getElementById("loginpw").value=""; // パスワードは即クリア
      if(!r.ok||d.error){
        authResult.innerHTML='<div class="msg err">ログインできませんでした（'+(d.error==="login-failed"?"ID/パスワードが違います":d.error||r.status)+'）</div>';
        return;
      }
      localStorage.setItem(AUTH_KEY,d.auth);
      document.getElementById("loginid").value="";
      syncAuthUI();
      loadMy();
    }catch(e){
      authResult.innerHTML='<div class="msg err">通信エラー</div>';
    }
  });
  document.getElementById("logoutbtn").addEventListener("click",()=>{
    localStorage.removeItem(AUTH_KEY);
    syncAuthUI();
    authResult.innerHTML='<div class="msg">ログアウトしました</div>';
  });
  syncAuthUI();

  // 初期表示
  let data0;
  (async()=>{
    // 共有用: ?sel=列,時 で初期選択
    const selParam=new URLSearchParams(location.search).get("sel");
    if(selParam){const[c,r]=selParam.split(",").map(Number);
      if(!isNaN(c))selCol=c; if(!isNaN(r))selRow=r;}
    const data=await load(false);
    if(!data) return;
    data0=data;
    render(data);
    if(localStorage.getItem(AUTH_KEY)){ myres.open=true; loadMy(); }
    const wbody=document.getElementById("wbody");
    const target=wbody.children[Math.max(0,nowHour-1)];
    if(target) target.scrollIntoView({block:"start"});
    window.scrollBy(0,-90);
  })();
})();
</script>
